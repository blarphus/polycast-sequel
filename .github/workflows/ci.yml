name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:dependency-policy
      - run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: production-sboms
          path: artifacts/sbom/*.cdx.json

  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [client, server, extension, cf-worker]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run check

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: createdb --host 127.0.0.1 --username postgres polycast_fresh
        env:
          PGPASSWORD: postgres
      - run: createdb --host 127.0.0.1 --username postgres polycast_legacy
        env:
          PGPASSWORD: postgres
      - run: bash scripts/check-database.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/polycast_fresh
          LEGACY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/polycast_legacy

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen 2.46.0
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          echo "$RUNNER_TEMP/xcodegen-release/xcodegen/bin" >> "$GITHUB_PATH"
      - run: bash scripts/check-xcodegen.sh
      - name: Provision iOS simulator
        run: |
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime_id="$(xcrun simctl list runtimes --json | jq -r --arg sdk "$sdk_version" '[.runtimes[] | select(.isAvailable and ((.version | split(".")[0]) == ($sdk | split(".")[0])))] | sort_by(.version) | last | .identifier')"
          if [[ -z "$runtime_id" ]]; then
            echo "{\"event\":\"ios_ci_compatible_runtime_unavailable\",\"sdk_version\":\"$sdk_version\"}"
            xcrun simctl list runtimes
            exit 1
          fi
          device_type_id="$(xcrun simctl list devicetypes --json | jq -r '.devicetypes[] | select(.name == "iPhone 16 Pro") | .identifier' | head -n 1)"
          simulator_id="$(xcrun simctl create Polycast-CI "$device_type_id" "$runtime_id")"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          echo "{\"event\":\"ios_ci_simulator_provisioned\",\"device_type\":\"$device_type_id\",\"runtime\":\"$runtime_id\",\"simulator_id\":\"$simulator_id\"}"
      - run: xcodebuild -project ios/Polycast.xcodeproj -scheme Polycast -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" -derivedDataPath /tmp/polycast-ci-derived-data test -only-testing:PolycastTests CODE_SIGNING_ALLOWED=NO
