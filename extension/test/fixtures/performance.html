<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Polycast 100k word performance test</title></head>
<body>
  <main id="article"><h1>Prueba de rendimiento</h1></main>
  <script>
    const article = document.getElementById('article');
    const phrase = 'el entorno ofrece un servicio y un medio para aprender vocabulario con contexto durante el día ';
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < 650; i += 1) {
      const paragraph = document.createElement('p');
      paragraph.textContent = phrase.repeat(10);
      fragment.append(paragraph);
    }
    article.append(fragment);
  </script>
</body>
</html>
