<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <link rel="stylesheet" href="popup.css">
  <title>Polycast</title>
</head>
<body>
  <div id="app">
    <!-- Loading state -->
    <div id="loading" class="view">
      <div class="spinner"></div>
    </div>

    <!-- Login form -->
    <div id="login-view" class="view hidden">
      <div class="logo">Polycast</div>
      <form id="login-form">
        <input type="text" id="username" placeholder="Username" autocomplete="username" required>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" id="login-btn">Sign In</button>
        <div id="login-error" class="error hidden"></div>
      </form>
    </div>

    <!-- Logged in status -->
    <div id="status-view" class="view hidden">
      <div class="user-info">
        <div class="display-name" id="display-name"></div>
        <div class="username" id="username-display"></div>
      </div>

      <div class="lang-cards">
        <div class="lang-card">
          <div class="lang-label">Native</div>
          <div class="lang-value" id="native-lang">—</div>
        </div>
        <div class="lang-card">
          <div class="lang-label">Learning</div>
          <div class="lang-value" id="target-lang">—</div>
        </div>
      </div>

      <div class="word-count">
        <span id="word-count-num">0</span> saved words
      </div>

      <label class="target-control" for="target-language-select">
        <span>Learning language</span>
        <select id="target-language-select">
          <option value="es">Spanish</option>
          <option value="pt">Portuguese</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh">Chinese</option>
          <option value="ar">Arabic</option>
          <option value="ru">Russian</option>
        </select>
      </label>

      <label class="api-control" for="api-base-input">
        <span>API server</span>
        <input type="url" id="api-base-input" placeholder="https://polycast-sequel.onrender.com">
      </label>
      <div class="api-actions">
        <button id="save-api-base-btn" class="btn-small" type="button">Save API</button>
        <button id="use-local-api-btn" class="btn-small" type="button">Use local</button>
      </div>
      <div id="settings-message" class="settings-message hidden"></div>

      <p class="hint">Click words in video subtitles to look them up.</p>

      <button id="open-app-btn" class="btn-open-app">Open Web App</button>
      <button id="logout-btn" class="btn-logout">Sign Out</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
