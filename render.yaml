services:
  - type: web
    name: polycast-sequel
    runtime: node
    plan: starter
    buildCommand: cd client && npm ci --include=dev && npm run build && cd ../server && npm ci --omit=dev
    startCommand: cd server && node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polycast-sequel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: polycast-sequel-kv
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MISTRAL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: CLIENT_ORIGIN
        value: https://polycast-sequel.onrender.com
      - key: CF_TRANSCRIPT_WORKER_URL
        sync: false
      - key: CF_TRANSCRIPT_WORKER_SECRET
        sync: false
      - key: INNERTUBE_API_KEY
        sync: false
      - key: EXTENSION_ORIGIN
        sync: false
      - key: CACHE_VERSION
        value: v1
      - key: FRIENDKEEPER_API_KEY
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: METERED_API_KEY
        sync: false
      - key: METERED_APP_NAME
        sync: false
  - type: keyvalue
    name: polycast-sequel-kv
    plan: starter
    ipAllowList: []

databases:
  - name: polycast-sequel-db
    plan: basic-256mb
    databaseName: polycast_sequel
    postgresMajorVersion: "16"
