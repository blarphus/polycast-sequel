name: Polycast
options:
  bundleIdPrefix: com.patron
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: "126.0.0"
  socket.io-client-swift:
    url: https://github.com/socketio/socket.io-client-swift
    exactVersion: "16.1.1"
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: DQNRTU7888
targets:
  Polycast:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Polycast/Sources
      - path: Polycast/Assets.xcassets
    dependencies:
      - package: WebRTC
      - package: socket.io-client-swift
        product: SocketIO
      - target: PolycastWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Polycast
        PRODUCT_BUNDLE_IDENTIFIER: com.patron.polycast
        CODE_SIGN_ENTITLEMENTS: Polycast/Polycast.entitlements
        INFOPLIST_FILE: Polycast/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    scheme:
      testTargets:
        - PolycastTests
        - PolycastUITests
  PolycastWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PolycastWidget
      - path: Polycast/Sources/Core/TodayWordsWidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patron.polycast.widget
        PRODUCT_NAME: PolycastWidget
        CODE_SIGN_ENTITLEMENTS: PolycastWidget/PolycastWidget.entitlements
        INFOPLIST_FILE: PolycastWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  PolycastTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Polycast/Tests
    dependencies:
      - target: Polycast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patron.polycast.tests
        GENERATE_INFOPLIST_FILE: YES
  PolycastUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Polycast/UITests
    dependencies:
      - target: Polycast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patron.polycast.uitests
        GENERATE_INFOPLIST_FILE: YES
